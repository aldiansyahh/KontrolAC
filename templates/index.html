<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard AC IoT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <script>

function updateDashboard() {
    fetch('/data')
        .then(res => res.json())
        .then(data => {
            console.log("DATA DARI SERVER:", data); // DEBUG
            document.getElementById('temperature').innerText =
                data.temperature !== null ? data.temperature.toFixed(1) : '-';

            document.getElementById('people').innerText =
                data.detected_people ?? 0;

            document.getElementById('ac-status').innerText =
                data.ac_status ?? 'OFF';

            document.getElementById('target-temp').innerText =
                data.target_temp !== null ? data.target_temp + '°C' : '-';
        })
        .catch(err => console.error('Fetch error:', err));
}

setInterval(updateDashboard, 1000);
updateDashboard();
</script>

</head>

<body>
<div class="d-flex" style="min-height:100vh">

    <!-- SIDEBAR -->
    <div class="bg-primary text-white p-3 d-flex flex-column sidebar"
        style="width:220px; min-height:100vh;">

      <h5 class="text-center mb-4">Smart AC</h5>
      <hr class="border-light">

      <ul class="nav nav-pills flex-column gap-2">
        <li class="nav-item">
          <a href="/" class="nav-link active bg-white text-primary fw-semibold">
            Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a href="/logs" class="nav-link text-white sidebar-link">
            Log AC
          </a>
        </li>
      </ul>

      <footer class="mt-auto text-white-50 small text-center pt-3">
        © 2025 Smart AC | Aldiansyah
      </footer>
    </div>



  <!-- CONTENT -->
  <div class="flex-fill p-4">
    <h4 class="text-primary mb-4">Monitoring AC</h4>

  <div class="d-flex justify-content-center gap-4 mb-4">
  <div class="text-center card shadow-sm text-white p-3 rounded"
       style="width:220px">
    <h6 class="text-secondary">Suhu Ruangan</h6>
    <h3 class="text-primary fw-bold">
      <span id="temperature">-°C</span>
    </h3>
  </div>
  <div class="text-center card shadow-sm text-white p-3 rounded"
       style="width:220px">
    <h6 class="text-secondary">Orang Terdeteksi</h6>
    <h3 class="text-primary fw-bold">
      <span id="people">0</span>
    </h3>
  </div>
  </div>

  <div class="d-flex justify-content-center gap-4 mb-4">
  <div class="text-center card shadow-sm text-white p-3 rounded"
       style="width:220px">
    <h6 class="text-secondary">Target Suhu</h6>
    <h3 class="text-primary fw-bold">
      <span id="target-temp">-°C</span>
    </h3>
  </div>
  <div class="text-center card shadow-sm text-white p-3 rounded"
       style="width:220px">
    <h6 class="text-secondary ">Status AC</h6>
    <h3 class="text-primary fw-bold" id="ac-status">OFF</h3>
  </div>
</div>
    <div class="card shadow-sm">
      <div class="card-header text-primary text-center">Live Camera</div>
      <div class="card-body text-center">
        <img src="/video_feed" class="img-fluid rounded">
      </div>
    </div>
  </div>
</div>
</body>
</html>
