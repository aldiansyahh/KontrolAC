<!DOCTYPE html>
<html>
<head>
    <title>ESP32-CAM Smart Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .monitor-card { max-width: 800px; margin: 30px auto; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .video-container { background: #000; text-align: center; min-height: 480px; display: flex; align-items: center; justify-content: center; }
        .video-container img { max-width: 100%; height: auto; }
        .sensor-box { padding: 20px; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div class="monitor-card">
    <div class="p-3 bg-primary text-white text-center">
        <h4>ESP32-CAM LIVE MONITOR</h4>
    </div>
    
    <div class="video-container">
        <img src="{{ url_for('video_feed') }}" onerror="this.src='https://placehold.co/640x480?text=Kamera+Terputus'">
    </div>

    <div class="sensor-box">
        <div class="row text-center">
            <div class="col-6">
                <h6>SUHU</h6>
                <h2 id="temp" class="text-danger">--</h2>
            </div>
            <div class="col-6">
                <h6>KELEMBAPAN</h6>
                <h2 id="hum" class="text-primary">--</h2>
            </div>
        </div>
    </div>

    <div class="p-3 bg-light text-center border-top">
        <button class="btn btn-warning px-5 fw-bold">🔫 MONITORING MODE</button>
    </div>
</div>

<script>
function updateDashboard() {
    fetch('/sensor_data')
        .then(res => res.json())
        .then(data => {
            console.log("Data diterima:", data);
            // SINKRONISASI ID: sesuaikan dengan ID di HTML di atas
            if(data.temperature !== "--") {
                document.getElementById('temp').innerText = data.temperature + "°C";
                document.getElementById('hum').innerText = data.humidity + "%";
            }
        })
        .catch(err => console.error('Gagal mengambil data:', err));
}

// Update setiap 3 detik
setInterval(updateDashboard, 3000);
updateDashboard();
</script>
</body>
</html>
